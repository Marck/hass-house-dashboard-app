# Static dashboard files. Authentication is not done here: the ingress in
# front of this container sends every request through the identity provider.
server {
    listen 8080;
    server_name _;
    server_tokens off;
    root /usr/share/nginx/html;
    index index.html;

    # The page sets its own Content-Security-Policy in a meta tag. These are the
    # parts a meta tag cannot express, plus the usual hardening headers.
    add_header Content-Security-Policy "frame-ancestors 'none'" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "no-referrer" always;
    # Always ask whether a file changed, so a wall tablet never runs an old build.
    add_header Cache-Control "no-cache" always;

    gzip on;
    gzip_types text/css application/javascript image/svg+xml;

    location = /healthz {
        access_log off;
        default_type text/plain;
        return 200 "ok\n";
    }

    location / {
        try_files $uri $uri/ =404;
    }
}
